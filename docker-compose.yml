services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xray-proxy-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/xray_proxy.db
      - SECRET_KEY=xray-proxy-super-secret-key-prod-2026-vps
      - CORS_ORIGINS=["*"]
    volumes:
      - /var/lib/xray-proxy:/data
    networks:
      - xray-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xray-proxy-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:80"
    depends_on:
      - backend
    networks:
      - xray-network

networks:
  xray-network:
    driver: bridge
